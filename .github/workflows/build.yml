name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default GITHUB_TOKEN is read-only; the release step needs contents: write.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/WinMaccy/WinMaccy.csproj -r win-x64

      - name: Build (Release)
        run: dotnet build src/WinMaccy/WinMaccy.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained single file
        run: >
          dotnet publish src/WinMaccy/WinMaccy.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: Stage release
        shell: pwsh
        run: |
          # GITHUB_REF_NAME is "1/merge" on pull requests, so sanitize it:
          # tags use the tag name, everything else uses the short commit SHA.
          $name = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          $name = $name -replace '[^A-Za-z0-9._-]', '-'
          "package name: WinMaccy-$name-win-x64" | Write-Host
          New-Item -ItemType Directory -Force -Path stage/WinMaccy | Out-Null
          Copy-Item publish/WinMaccy.exe stage/WinMaccy/
          Copy-Item README.md stage/WinMaccy/
          Compress-Archive -Path stage/WinMaccy/* -DestinationPath "WinMaccy-$name-win-x64.zip"
          Copy-Item publish/WinMaccy.exe "WinMaccy-$name-win-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: WinMaccy-win-x64
          path: |
            WinMaccy-*.exe
            WinMaccy-*.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WinMaccy-*.exe
            WinMaccy-*.zip
            docs/winmaccy-demo.mp4
          overwrite_files: true
          generate_release_notes: true
