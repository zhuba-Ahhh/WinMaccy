name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default GITHUB_TOKEN is read-only; the release step needs contents: write.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/WinMaccy/WinMaccy.csproj -r win-x64

      - name: Build (Release)
        run: dotnet build src/WinMaccy/WinMaccy.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained single file
        run: >
          dotnet publish src/WinMaccy/WinMaccy.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: Stage release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/WinMaccy | Out-Null
          Copy-Item publish/WinMaccy.exe stage/WinMaccy/
          Copy-Item README.md stage/WinMaccy/
          Compress-Archive -Path stage/WinMaccy/* -DestinationPath WinMaccy-$($env:GITHUB_REF_NAME)-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinMaccy-win-x64
          path: |
            publish/WinMaccy.exe
            WinMaccy-*.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WinMaccy-*.zip
          generate_release_notes: true
